<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Fault Diagnosis</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f1117;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 48px 20px;
    }

    .container {
      width: 100%;
      max-width: 700px;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 600;
      color: #fff;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 0.875rem;
      color: #666;
      margin-bottom: 32px;
    }

    .card {
      background: #1a1d27;
      border: 1px solid #2a2d3a;
      border-radius: 12px;
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    label {
      display: block;
      font-size: 0.8rem;
      color: #888;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    input[type="text"],
    textarea {
      width: 100%;
      background: #0f1117;
      border: 1px solid #2a2d3a;
      border-radius: 8px;
      color: #e0e0e0;
      font-size: 0.9rem;
      padding: 10px 14px;
      outline: none;
      resize: vertical;
      transition: border-color 0.2s;
      font-family: inherit;
    }

    input[type="text"]:focus,
    textarea:focus {
      border-color: #4f6ef7;
    }

    .file-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .file-btn {
      background: #0f1117;
      border: 1px solid #2a2d3a;
      border-radius: 8px;
      color: #aaa;
      font-size: 0.875rem;
      padding: 9px 16px;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
      white-space: nowrap;
    }

    .file-btn:hover {
      border-color: #4f6ef7;
      color: #fff;
    }

    #file_name {
      font-size: 0.875rem;
      color: #555;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #file_name.selected {
      color: #aaa;
    }

    input[type="file"] {
      display: none;
    }

    .run-btn {
      background: #4f6ef7;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 11px 24px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
      align-self: flex-start;
    }

    .run-btn:hover { background: #3a57e8; }
    .run-btn:disabled {
      background: #1f2235;
      color: #444;
      cursor: not-allowed;
    }

    .output-card {
      margin-top: 24px;
      background: #1a1d27;
      border: 1px solid #2a2d3a;
      border-radius: 12px;
      padding: 24px;
      display: none;
    }

    .output-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #555;
      margin-bottom: 14px;
    }

    #output_box {
      font-size: 0.875rem;
      line-height: 1.8;
      color: #ccc;
      white-space: pre-wrap;
      min-height: 160px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Smart Fault Diagnosis</h1>
    <p class="subtitle">Upload sensor data or error logs to diagnose machine faults</p>

    <div class="card">
      <div>
        <label for="machine_name">Machine Name</label>
        <input type="text" id="machine_name" placeholder="e.g. CNC Machine #3">
      </div>

      <div>
        <label for="extra_context">Context (optional)</label>
        <textarea id="extra_context" rows="2" placeholder="e.g. Running 8 hours, burning smell noticed"></textarea>
      </div>

      <div>
        <label>Data File &nbsp;(.csv, .json, .txt, .log)</label>
        <div class="file-row">
          <label class="file-btn" for="file_input">Choose File</label>
          <input type="file" id="file_input" accept=".csv,.json,.txt,.log">
          <span id="file_name">No file chosen</span>
        </div>
      </div>

      <button class="run-btn" id="diagnose_btn" onclick="runDiagnosis()">Run Diagnosis</button>
    </div>

    <div class="output-card" id="output_section">
      <div class="output-label">Diagnosis Report</div>
      <div id="output_box"></div>
    </div>
  </div>

  <script>
    const fileInput = document.getElementById("file_input");
    const fileName = document.getElementById("file_name");

    fileInput.addEventListener("change", () => {
      if (fileInput.files.length > 0) {
        fileName.textContent = fileInput.files[0].name;
        fileName.classList.add("selected");
      }
    });

    function runDiagnosis() {
      const file = fileInput.files[0];
      const machineName = document.getElementById("machine_name").value.trim();
      const extraContext = document.getElementById("extra_context").value.trim();
      const btn = document.getElementById("diagnose_btn");
      const outputSection = document.getElementById("output_section");
      const outputBox = document.getElementById("output_box");

      if (!file) {
        alert("Please choose a file first.");
        return;
      }

      const formData = new FormData();
      formData.append("file", file);
      formData.append("machine_name", machineName);
      formData.append("extra_context", extraContext);

      btn.disabled = true;
      btn.textContent = "Diagnosing...";
      outputBox.textContent = "";
      outputSection.style.display = "block";

      fetch("/diagnose", {
        method: "POST",
        body: formData
      }).then(response => {
        const reader = response.body.getReader();
        const decoder = new TextDecoder();

        function read() {
          reader.read().then(({ done, value }) => {
            if (done) {
              btn.disabled = false;
              btn.textContent = "Run Diagnosis";
              return;
            }

            const chunk = decoder.decode(value);
            const lines = chunk.split("\n");

            lines.forEach(line => {
              if (line.startsWith("data: ")) {
                const text = line.slice(6);
                if (text === "[DONE]") {
                  btn.disabled = false;
                  btn.textContent = "Run Diagnosis";
                  return;
                }
                outputBox.textContent += text;
                outputBox.scrollTop = outputBox.scrollHeight;
              }
            });

            read();
          });
        }

        read();
      }).catch(() => {
        outputBox.textContent = "Error: Could not connect to server.";
        btn.disabled = false;
        btn.textContent = "Run Diagnosis";
      });
    }
  </script>
</body>
</html>
